<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MH">
  <defs>
    <linearGradient id="bg" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#12141c"/>
      <stop offset="45%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#0a1620"/>
    </linearGradient>
    <linearGradient id="glow" x1="20%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#a575ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#57e3a0" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="mh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f7ff"/>
      <stop offset="45%" stop-color="#dce8ff"/>
      <stop offset="100%" stop-color="#57e3a0"/>
    </linearGradient>
    <radialGradient id="spot" cx="30%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="32" cy="32" r="32"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
    <circle cx="32" cy="32" r="32" fill="url(#glow)"/>
    <circle cx="32" cy="32" r="32" fill="url(#spot)"/>
    <path d="M10 48 C22 56, 42 56, 54 46" fill="none" stroke="#57e3a0"
          stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/>
    <text x="32" y="41.5"
          text-anchor="middle"
          font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
          font-size="26"
          font-weight="800"
          letter-spacing="-1.2"
          fill="url(#mh)">MH</text>
  </g>

  <!-- Crisp circular rim -->
  <circle cx="32" cy="32" r="31.25" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.25"/>
</svg>
