<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hamza — Atelier template</title>
    <link rel="stylesheet" href="../css/atelier.css" />
  </head>
  <body>
    <header>
      <div class="wrap bar">
        <a class="brand" href="../index.html">
          <div class="mark" data-bind="name">Hamza</div>
          <div class="who">
            <b data-bind="title">Lead Software Engineer</b>
            <span>Portfolio / 2026</span>
          </div>
        </a>
        <div class="actions">
          <div class="toggle">
            <button type="button" class="on" data-voice-btn="engineer">Engineer</button>
            <button type="button" data-voice-btn="pm">PM</button>
          </div>
          <button class="ghost" type="button" data-open-intro>Watch intro</button>
          <a class="back" href="../index.html">All templates</a>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <div class="kicker"><span data-bind="status">available</span></div>
        <h1>
          I build the<br />
          <span class="g wr" data-bind="words"></span><br />
          that scale.
        </h1>
        <p class="sub" data-bind="sub"></p>
        <div class="heroGrid">
          <div>
            <p class="intro" data-bind="intro"></p>
            <div class="stack" data-bind="skills"></div>
          </div>
          <aside class="cardStat" data-bind="stats"></aside>
        </div>
      </section>

      <section id="work">
        <div class="eyebrow">Selected work</div>
        <div data-bind="work"></div>
      </section>

      <section>
        <div class="eyebrow">Earlier work</div>
        <div class="earlier" data-bind="earlier"></div>
      </section>

      <section class="about">
        <div class="eyebrow">About</div>
        <div data-bind="about"></div>
      </section>

      <section class="contact">
        <h2>Let's build<br /><span class="g">something that scales.</span></h2>
        <p data-bind="cta"></p>
        <div class="contact-row">
          <a class="cbtn" data-bind="email"></a>
          <a class="cbtn" data-bind="linkedin">LinkedIn</a>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        <span><span data-bind="name"></span> © <span data-bind="year"></span></span>
        <span data-bind="title"></span>
      </div>
    </footer>

    <div class="overlay" data-intro>
      <div class="modal">
        <button class="modal-close" type="button" data-close-intro>✕</button>
        <h3>Intro video</h3>
        <p>Placeholder for your intro. We can drop in a video or portrait later.</p>
      </div>
    </div>

    <script src="../js/content.js"></script>
    <script src="../js/common.js"></script>
  </body>
</html>
