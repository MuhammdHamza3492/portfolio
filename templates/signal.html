<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hamza — Signal template</title>
    <link rel="stylesheet" href="../css/signal.css" />
  </head>
  <body>
    <aside class="side">
      <div>
        <a class="brand" href="../index.html">
          <div class="mark" data-bind="initials">H</div>
          <div class="who">
            <b data-bind="name">Hamza</b>
            <span data-bind="title">Lead Software Engineer</span>
          </div>
        </a>
        <div class="kicker" style="margin-top: 20px"><i class="dot"></i><span data-bind="status">available</span></div>
      </div>
      <nav>
        <a href="#work">01 work</a>
        <a href="#earlier">02 earlier</a>
        <a href="#about">03 about</a>
        <a href="#contact">04 contact</a>
      </nav>
      <div>
        <div class="toggle">
          <button type="button" class="on" data-voice-btn="engineer">/ engineer</button>
          <button type="button" data-voice-btn="pm">/ pm</button>
        </div>
        <button class="ghost" type="button" data-open-intro">watch intro</button>
        <a class="back" href="../index.html">← all templates</a>
      </div>
    </aside>

    <main>
      <section class="hero">
        <h1>
          I build the<br />
          <span class="g wr" data-bind="words"></span><br />
          that scale.
        </h1>
        <p class="sub" data-bind="sub"></p>
        <div class="heroGrid">
          <div>
            <p class="intro" data-bind="intro"></p>
            <div class="stack" data-bind="skills"></div>
          </div>
          <aside class="cardStat" data-bind="stats"></aside>
        </div>
      </section>

      <section id="work">
        <div class="eyebrow">Selected work</div>
        <div data-bind="work"></div>
      </section>

      <section id="earlier">
        <div class="eyebrow">Earlier work</div>
        <div class="earlier" data-bind="earlier"></div>
      </section>

      <section class="about" id="about">
        <div class="eyebrow">About</div>
        <div data-bind="about"></div>
      </section>

      <section class="contact" id="contact">
        <h2>Let's build<br /><span class="g">something that scales.</span></h2>
        <p data-bind="cta"></p>
        <div class="contact-row">
          <a class="cbtn" data-bind="email"></a>
          <a class="cbtn" data-bind="linkedin">LinkedIn →</a>
        </div>
      </section>

      <footer>
        <span><span data-bind="name"></span> © <span data-bind="year"></span></span>
        <span data-bind="title"></span>
      </footer>
    </main>

    <div class="overlay" data-intro>
      <div class="modal">
        <button class="modal-close" type="button" data-close-intro>✕</button>
        <h3>Intro video</h3>
        <p>Placeholder for your intro clip.</p>
      </div>
    </div>

    <script src="../js/content.js"></script>
    <script src="../js/common.js"></script>
  </body>
</html>
