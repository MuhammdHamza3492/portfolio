<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="../" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhammad Hamza — Lead Full-Stack &amp; Systems Engineer</title>
    <meta
      name="description"
      content="Muhammad Hamza — Lead Full-Stack & Systems Engineer. High-concurrency platforms, B2B APIs, and low-latency client systems."
    />
    <link rel="stylesheet" href="css/site.css?v=25" />
  </head>
  <body>
    <div id="progress" data-progress></div>
    <div id="spotlight" data-spotlight></div>
    <div id="hero3d" aria-hidden="true"><canvas id="hero3d-canvas"></canvas></div>

    <header>
      <div class="wrap bar">
        <div class="brand">
          <button class="mark" type="button" data-open-intro title="View photo">
            <img src="images/hamza.jpg" alt="Muhammad Hamza" />
          </button>
          <div class="who">
            <b data-bind="name">Muhammad Hamza</b>
            <span data-bind="title">Lead Full-Stack &amp; Systems Engineer</span>
          </div>
        </div>
        <div class="actions">
          <div class="toggle" role="tablist" aria-label="Profile">
            <button type="button" data-voice-btn="engineer">SE</button>
            <button type="button" data-voice-btn="pm">PM</button>
          </div>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <div class="kicker reveal"><span class="dot"></span><span data-bind="status">available</span></div>
        <h1>
          I <span data-bind="verb">build</span> the<br />
          <span class="wr" data-bind="words"></span><br />
          that scale.
        </h1>
        <p class="sub reveal" data-bind="sub"></p>
        <div class="heroGrid">
          <div>
            <p class="intro reveal" data-bind="intro"></p>
            <div class="stack reveal" data-bind="skills"></div>
          </div>
          <aside class="cardStat reveal" data-bind="stats"></aside>
        </div>
      </section>

      <section>
        <div class="eyebrow reveal">Selected work</div>
        <div data-bind="work"></div>
      </section>

      <section>
        <div class="eyebrow reveal">Earlier work</div>
        <div class="earlier" data-bind="earlier"></div>
      </section>

      <section class="about">
        <div class="eyebrow reveal">About</div>
        <div data-bind="about"></div>
      </section>

      <section class="contact">
        <div class="eyebrow reveal">Get in touch</div>
        <h2 class="reveal">Let's build<br />something <span class="g">that scales.</span></h2>
        <p class="reveal" data-bind="cta"></p>
        <div class="contact-row reveal">
          <a class="cbtn" data-bind="email"></a>
          <a class="cbtn" data-phone></a>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        <span><span data-bind="name"></span> © <span data-bind="year"></span></span>
        <span data-bind="title"></span>
      </div>
    </footer>

    <div class="overlay" data-intro>
      <div class="modal">
        <button class="modal-close" type="button" data-close-intro>✕</button>
        <img src="images/hamza.jpg" alt="Muhammad Hamza" />
      </div>
    </div>

    <div class="lb-overlay" id="lb-overlay" hidden>
      <div class="lb-box">
        <div class="lb-head">
          <span class="lb-head-title"><b id="lb-title">Screenshot</b></span>
          <div class="lb-head-right">
            <span class="lb-count" id="lb-count">1 / 1</span>
            <button class="lb-nav" type="button" id="lb-prev" aria-label="Previous">←</button>
            <button class="lb-nav" type="button" id="lb-next" aria-label="Next">→</button>
            <button class="lb-close" type="button" id="lb-close" aria-label="Close">✕</button>
          </div>
        </div>
        <div class="lb-img-area" id="lb-img-area">
          <div class="lb-zoom-bar">
            <button class="lb-zoom-btn" type="button" id="lb-zoom-out" title="Zoom out">−</button>
            <span class="lb-zoom-level" id="lb-zoom-level" title="Reset zoom">100%</span>
            <button class="lb-zoom-btn" type="button" id="lb-zoom-in" title="Zoom in">+</button>
          </div>
          <div class="shot-wrap" id="lb-shot">
            <img id="lb-img" src="" alt="" />
            <div class="shot-masks" id="lb-masks" aria-hidden="true"></div>
          </div>
        </div>
        <div class="lb-dots" id="lb-dots"></div>
      </div>
    </div>

    <script>window.__INITIAL_VOICE = "engineer";</script>
    <script src="js/content.js?v=25"></script>
    <script src="js/common.js?v=25"></script>
    <script src="js/hero3d.js?v=25"></script>
  </body>
</html>
